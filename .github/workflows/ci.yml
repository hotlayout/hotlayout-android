name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 runs Gradle; 17 is the toolchain the library compiles with.
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Public API, release compilation and tests
        run: ./gradlew :hotlayout:apiCheck :hotlayout:compileReleaseKotlin test
